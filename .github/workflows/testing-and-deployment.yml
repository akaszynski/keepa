name: CI/CD

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
    - '*'
    branches:
    - main

jobs:
  compression_testing:
    name: Compression (${{ matrix.python-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
        dependencies: [minimum, current]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install
      run: pip install .[test] --disable-pip-version-check
    - name: Install minimum transport dependencies
      if: matrix.dependencies == 'minimum'
      run: >-
        pip install "requests==2.32.5" "urllib3[zstd]==2.7.0"
        "aiohttp==3.14.0" "backports.zstd==1.0.0; python_version < '3.14'"
    - name: Test compression over HTTP
      run: pytest -v tests/test_compression.py --no-cov

  unit_testing:
    name: Build and Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    env:
      KEEPAKEY: ${{ secrets.KEEPAKEY }}
      WEAKKEEPAKEY: ${{ secrets.WEAKKEEPAKEY }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install
      run: |
        pip install .[test] --disable-pip-version-check
        python -c "import keepa"

    - name: Validate Keys
      run: |
        python -c "import os, keepa; keepa.Keepa(os.environ.get('KEEPAKEY'))"

    - name: Unit testing
      run: |
        pytest -v --cov keepa --cov-report xml

    - uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.14'
      name: Upload coverage to codecov

    - name: Build wheel
      if: matrix.python-version == '3.14'
      run: |
        pip install build --disable-pip-version-check
        python -m build

    - name: Upload wheel
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@v6
      with:
        name: keepa-wheel
        path: dist/
        retention-days: 1
        if-no-files-found: error

  release:
    name: Upload release to PyPI
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [unit_testing, compression_testing]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/keepa
    permissions:
      id-token: write  # Required for PyPI publishing
      contents: write  # Required for creating GitHub releases
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: dist/
    - name: Display structure of downloaded files
      run: ls -R
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          ./**/*.whl
